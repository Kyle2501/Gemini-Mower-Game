<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Meadow - Handheld Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background: #121214;
            color: #e2e2e9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
        }

        /* Handheld Console Wrapper */
        #console-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 500px; /* Keeps it looking like a crisp vertical console even on wider screens */
            background: #252529; /* Gameboy-esque plastic chassis color */
            border-left: 4px solid #3f3f46;
            border-right: 4px solid #18181b;
        }

        /* Top 2/3: The Screen Area */
        #screen-area {
            height: 66.66vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            padding: 12px;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4);
        }

        #canvas-wrapper {
            width: 100%;
            position: relative;
            background: #1c1c1f;
            border: 4px solid #3d3d41;
        }

        canvas {
            display: block;
            background: #34542d;
            width: 100%;
            height: auto;
        }

        #hud {
            width: 100%;
            height: 40px;
            background: #1c1c1f;
            border-top: 3px solid #3d3d41;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 11px;
            text-transform: uppercase;
            color: #a3a3ac;
        }

        .stat-box {
            background: #27272a;
            border: 1px solid #4f4f56;
            padding: 2px 6px;
        }

        .stat-value {
            color: #ff6b8b;
            font-weight: bold;
        }

        /* Bottom 1/3: The Hardware Controller Faceplate */
        #controller-area {
            height: 33.33vh;
            background: #2d2d34; /* Slightly different tone for the lower deck breakdown */
            border-top: 6px solid #1c1c1f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            position: relative;
            box-shadow: inset 0 10px 15px rgba(255,255,255,0.05);
        }

        /* Classic Cross D-Pad */
        #dpad {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .dpad-btn {
            position: absolute;
            background: #18181b;
            border: 1px solid #3f3f46;
            box-shadow: 0 4px 0 #09090b;
        }
        .dpad-btn:active {
            background: #3f3f46;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #09090b;
        }

        #dpad-up    { top: 0; left: 42px; width: 36px; height: 45px; border-radius: 4px 4px 0 0; }
        #dpad-down  { bottom: 0; left: 42px; width: 36px; height: 45px; border-radius: 0 0 4px 4px; }
        #dpad-left  { top: 42px; left: 0; width: 45px; height: 36px; border-radius: 4px 0 0 4px; }
        #dpad-right { top: 42px; right: 0; width: 45px; height: 36px; border-radius: 0 4px 4px 0; }
        
        #dpad-center {
            position: absolute;
            top: 42px;
            left: 42px;
            width: 36px;
            height: 36px;
            background: #18181b;
            z-index: 2;
        }

        /* Diagonal Layout A / B Action Buttons */
        #action-buttons {
            display: flex;
            gap: 20px;
            transform: rotate(-15deg); /* Classic angled alignment */
            margin-bottom: 15px;
        }

        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #a72729; /* Classic maroon-red button housing color */
            border: 2px solid #18181b;
            box-shadow: -2px 4px 0 #5c1416, 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: #18181b;
        }
        .action-btn:active {
            transform: translate(-1px, 2px);
            box-shadow: -1px 2px 0 #5c1416;
        }
    </style>
</head>
<body>

    <div id="console-container">
        
        <div id="screen-area">
            <div id="canvas-wrapper">
                <canvas id="gameCanvas" width="896" height="504"></canvas>
                <div id="hud">
                    <div class="stat-box">WEA: <span class="stat-value">CALM</span></div>
                    <div class="stat-box">CUT: <span class="stat-value" id="cut-percentage">0%</span></div>
                </div>
            </div>
        </div>

        <div id="controller-area">
            
            <div id="dpad">
                <div id="dpad-up" class="dpad-btn" data-dir="up"></div>
                <div id="dpad-down" class="dpad-btn" data-dir="down"></div>
                <div id="dpad-left" class="dpad-btn" data-dir="left"></div>
                <div id="dpad-right" class="dpad-btn" data-dir="right"></div>
                <div id="dpad-center"></div>
            </div>

            <div id="action-buttons">
                <div id="btn-b" class="action-btn">B</div>
                <div id="btn-a" class="action-btn">A</div>
            </div>

        </div>

    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const V_WIDTH = 896;
    const V_HEIGHT = 504;
    const COLS = 32;
    const ROWS = 18;
    const TILE_SIZE = V_WIDTH / COLS;

    let grid = [];
    let totalGrassTiles = COLS * ROWS;

    function initGrid() {
        grid = [];
        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) {
                row.push(Math.floor(Math.random() * 3) + 1);
            }
            grid.push(row);
        }
    }

    const mower = {
        x: V_WIDTH / 2,
        y: V_HEIGHT / 2,
        radius: 14,
        speed: 4,
        angle: 0,
        targetAngle: 0,
        colorBody: '#d9383a',
        colorTrim: '#1a1a1a'
    };

    // Unified Input Controller States
    const activeMovement = { up: false, down: false, left: false, right: false };
    const keys = {};

    // Map hardware physical touch nodes to internal system vectors
    const bindDpadTouch = (id, direction) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); activeMovement[direction] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); activeMovement[direction] = false; });
    };

    bindDpadTouch('dpad-up', 'up');
    bindDpadTouch('dpad-down', 'down');
    bindDpadTouch('dpad-left', 'left');
    bindDpadTouch('dpad-right', 'right');

    // Desktop keyboard fallback controls
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function calculateSystemVectors() {
        let dx = 0;
        let dy = 0;

        // Extract keyboard registers
        if (keys['ArrowUp'] || keys['w']) dy = -1;
        if (keys['ArrowDown'] || keys['s']) dy = 1;
        if (keys['ArrowLeft'] || keys['a']) dx = -1;
        if (keys['ArrowRight'] || keys['d']) dx = 1;

        // Combine touch button inputs
        if (activeMovement.up) dy = -1;
        if (activeMovement.down) dy = 1;
        if (activeMovement.left) dx = -1;
        if (activeMovement.right) dx = 1;

        if (dx !== 0 || dy !== 0) {
            mower.targetAngle = Math.atan2(dy, dx);
            
            let angleDiff = mower.targetAngle - mower.angle;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            mower.angle += angleDiff * 0.25; // Snappy serpentine interpolation

            mower.x += dx * mower.speed;
            mower.y += dy * mower.speed;

            mower.x = Math.max(mower.radius, Math.min(V_WIDTH - mower.radius, mower.x));
            mower.y = Math.max(mower.radius, Math.min(V_HEIGHT - mower.radius, mower.y));

            checkGrassCut();
        }
    }

    function checkGrassCut() {
        const col = Math.floor(mower.x / TILE_SIZE);
        const row = Math.floor(mower.y / TILE_SIZE);

        if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
            if (grid[row][col] > 0) {
                grid[row][col] = 0;
                updateMetrics();
            }
        }
    }

    function updateMetrics() {
        let currentCut = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c] === 0) currentCut++;
            }
        }
        const pct = Math.floor((currentCut / totalGrassTiles) * 100);
        document.getElementById('cut-percentage').innerText = `${pct}%`;
    }

    function drawGrass() {
        const grassColors = {
            0: '#4d6e42', 
            1: '#3d5e33', 
            2: '#34542d', 
            3: '#284422'  
        };

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                ctx.fillStyle = grassColors[grid[r][c]];
                ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE - 0.5, TILE_SIZE - 0.5);
            }
        }
    }

    function drawMower() {
        ctx.save();
        ctx.translate(mower.x, mower.y);
        ctx.rotate(mower.angle);

        ctx.fillStyle = mower.colorTrim;
        ctx.fillRect(-16, -12, 32, 24);

        ctx.fillStyle = mower.colorBody;
        ctx.fillRect(-10, -9, 20, 18);

        ctx.strokeStyle = '#71717a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-16, -8);
        ctx.lineTo(-24, -8);
        ctx.moveTo(-16, 8);
        ctx.lineTo(-24, 8);
        ctx.stroke();

        ctx.restore();
    }

    function loop() {
        ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
        
        calculateSystemVectors();
        drawGrass();
        drawMower();

        requestAnimationFrame(loop);
    }

    initGrid();
    loop();
</script>
</body>
</html>
